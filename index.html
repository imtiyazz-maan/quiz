<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتياز - Memory Vault</title>
    <style>
        :root { 
            --primary: #1e4d2b; --accent: #c5a059; --success: #27ae60; --light: #fdfdfd;
            --bg-body: #f0f2f0; --bg-container: #ffffff; --text-main: #333333;
            --input-bg: #ffffff; --input-border: #eeeeee;
        }
        body.dark-mode {
            --bg-body: #121212; --bg-container: #1e1e1e; --text-main: #e0e0e0;
            --input-bg: #2d2d2d; --input-border: #444444;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); 
            color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; transition: 0.3s; 
        }
        .container { 
            background: var(--bg-container); width: 100%; max-width: 700px; padding: 30px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px; border-top: 5px solid var(--accent); position: relative; 
            display: flex; flex-direction: column;
        }

        .header-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
        }
        
        /* Dropdown Bahasa (Pojok Kiri) */
        .lang-dropdown {
            position: absolute;
            top: 15px;
            left: 15px;
            display: inline-block;
            z-index: 100;
        }
        
        /* Tombol Mode Cahaya Terpisah (Pojok Kanan) */
        .theme-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--bg-container);
            color: var(--text-main);
            padding: 6px 10px;
            font-size: 0.8rem;
            border: 1px solid var(--accent);
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }

        .dropbtn {
            background: var(--bg-container);
            color: var(--text-main);
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid var(--accent);
            border-radius: 5px;
            cursor: pointer;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            left: 0;
            background-color: var(--bg-container);
            min-width: 90px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            border-radius: 5px;
            border: 1px solid var(--input-border);
            margin-top: 5px;
            overflow: hidden;
        }
        .dropdown-content button {
            color: var(--text-main);
            padding: 8px 12px;
            display: block;
            background: none;
            border: none;
            width: 100%;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .dropdown-content button:hover {
            background-color: rgba(197, 160, 89, 0.2);
        }
        .show { display: block; }

        .brand { text-align: center; }
        .brand h1 { color: var(--primary); margin: 0; font-size: 2.2rem; }
        
        textarea, input, select { width: 100%; padding: 12px; border: 2px solid var(--input-border); background: var(--input-bg); color: var(--text-main); border-radius: 10px; box-sizing: border-box; font-family: inherit; margin-bottom: 10px; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 10px; transition: 0.3s; }
        .btn-bulk { background: var(--primary); color: white; }
        .btn-start { background: #2c3e50; color: white; }
        .btn-reveal { background: var(--accent); color: white; }
        .btn-correct { background: var(--success); color: white; }
        .btn-wrong { background: #e74c3c; color: white; }
        
        #timer-container { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-bottom: 15px; overflow: hidden; display: none; }
        #timer-bar { width: 100%; height: 100%; background: var(--accent); transition: width 1s linear; }

        .settings-box { background: rgba(0,0,0,0.05); padding: 15px; border-radius: 15px; margin: 15px 0; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: center; }
        
        /* Saklar Geser (Toggle Switch) */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--success);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        body[lang="ar"] input:checked + .slider:before {
            transform: translateX(-20px);
        }
        body[lang="ar"] .slider:before {
            left: auto;
            right: 3px;
        }

        /* Tata Letak Tombol Aksi di Menu Utama */
        .action-btns-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        #quiz-section, #result-section { display: none; text-align: center; }
        .answer-box { background: rgba(197, 160, 89, 0.1); border-right: 6px solid var(--accent); padding: 20px; margin-top: 20px; display: none; text-align: right; border-radius: 10px; }
        .eval-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        
        body[lang="id"], body[lang="en"] { direction: ltr; text-align: left; }
        body[lang="ar"] { direction: rtl; text-align: right; }
        body[lang="id"] .answer-box, body[lang="en"] .answer-box { border-right: none; border-left: 6px solid var(--accent); text-align: left; }
    </style>
</head>
<body lang="ar">

<div id="setup-section" class="container">
    <div class="header-wrapper">
        <div class="lang-dropdown">
            <button onclick="toggleLangMenu()" class="dropbtn" id="current-lang-btn">🌐 AR</button>
            <div id="langDropdown" class="dropdown-content">
                <button onclick="changeLang('id')">ID</button>
                <button onclick="changeLang('en')">EN</button>
                <button onclick="changeLang('ar')">AR</button>
            </div>
        </div>
        
        <button class="theme-toggle-btn" id="dark-toggle" onclick="toggleDarkMode()">🌙</button>

        <div class="brand">
            <h1 id="txt-title">امتياز</h1>
            <p id="txt-subtitle">Platform Murojaah Mandiri</p>
        </div>
    </div>
    
    <div style="background: rgba(0,0,0,0.03); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
        <label><b id="txt-label-maddah">اسم المادة:</b></label>
        <input type="text" id="maddah-name" placeholder="...">
        <label><b id="txt-label-input">إدخال البيانات (سؤال : جواب):</b></label>
        <textarea id="bulk-input" rows="5"></textarea>
        <button class="btn btn-bulk" id="txt-btn-save" onclick="processBulk()">حفظ البيانات</button>
    </div>
    
    <hr style="opacity: 0.2;">
    
    <div class="settings-box">
        <div class="switch-container" onclick="document.getElementById('timer-toggle').click();">
            <span id="txt-timer-on" style="font-weight: bold;">تفعيل المؤقت</span>
            <label class="switch" onclick="event.stopPropagation();">
                <input type="checkbox" id="timer-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="txt-timer-sec">المدة (ثانية):</span>
            <input type="number" id="timer-duration" value="20" min="5" style="width: 70px; margin: 0; padding: 5px;">
        </div>
    </div>

    <div style="text-align: center;">
        <label><b id="txt-label-select">اختر المادة للتدريب:</b></label>
        <select id="select-maddah" onchange="updateMaddahInfo()"></select>
        <p id="count-info">...</p>
        
        <button id="start-btn" class="btn btn-start" onclick="startQuiz()" disabled>ابدأ التدريب</button>
        
        <div class="action-btns-grid">
            <button class="btn" style="background:transparent; color:#e74c3c; font-size:0.8rem; border: 1px solid #e74c3c; margin:0;" id="txt-btn-delete" onclick="deleteSelectedMaddah()">حذف المادة</button>
            <button class="btn" style="background:transparent; color:#3498db; font-size:0.8rem; border: 1px solid #3498db; margin:0;" id="txt-btn-share" onclick="shareSelectedMaddah()">🔗 مشاركة المادة</button>
        </div>
    </div>
</div>

<div id="quiz-section" class="container">
    <div id="timer-container"><div id="timer-bar"></div></div>
    <p id="progress"></p>
    <h2 id="q-text" style="line-height: 1.5; min-height: 60px;"></h2>
    <button id="reveal-btn" class="btn btn-reveal" onclick="revealAnswer()">إظهار الإجابة</button>
    <div id="answer-container" class="answer-box"><strong id="txt-label-ans">الإجابة:</strong><p id="a-text" style="font-size: 1.2rem; margin-top: 10px;"></p></div>
    <div id="eval-section" class="eval-btns" style="display:none;">
        <button class="btn btn-wrong" id="txt-btn-wrong" onclick="processResult(false)">نسيت</button>
        <button class="btn btn-correct" id="txt-btn-correct" onclick="processResult(true)">حفظت</button>
    </div>
</div>

<div id="result-section" class="container">
    <h2 id="txt-res-title">النتيجة النهائية</h2>
    <p id="score-text" style="font-size: 3rem; font-weight: bold; color: var(--primary);"></p>
    <button class="btn btn-start" id="txt-btn-restart" onclick="location.reload()">العودة</button>
</div>

<script>
    const i18n = {
        id: { subtitle: "Latih Memori & Murojaah Mandiri", lMaddah: "Nama Mata Kuliah (Maddah):", lInput: "Input Materi (Soal : Jawaban):", btnSave: "Simpan Materi", lSelect: "Pilih Materi untuk Latihan:", btnDelete: "Hapus Maddah Ini", btnShare: "🔗 Bagikan Materi", btnStart: "Mulai Latihan Acak", btnReveal: "Buka Jawaban", lAns: "Kunci Jawaban:", btnWrong: "Lupa / Salah", btnCorrect: "Hafal / Benar", resTitle: "Hasil Evaluasi", btnRestart: "Kembali ke Menu Utama", countMsg: (n) => `Terdeteksi ${n} soal.`, tOn: "Aktifkan Timer", tSec: "Durasi (detik):", alertShare: "Tautan berhasil disalin! Silakan bagikan ke teman-teman.", alertNoData: "Pilih materi terlebih dahulu sebelum membagikan.", alertImport: "Materi baru berhasil diimpor otomatis!" },
        ar: { subtitle: "منصة تدريب الذاكرة والمراجعة", lMaddah: "اسم المادة:", lInput: "إدخل البيانات:", btnSave: "حفظ البيانات", lSelect: "اختر المادة:", btnDelete: "حذف هذه المادة", btnShare: "🔗 مشاركة المادة", btnStart: "ابدأ التدريب", btnReveal: "إظهار الإجابة", lAns: "الإجابة الصحيحة:", btnWrong: "نسيت", btnCorrect: "حفظت", resTitle: "النتيجة النهائية", btnRestart: "العودة للقائمة", countMsg: (n) => `تم العثور على ${n} أسئلة.`, tOn: "تفعيل المؤقت", tSec: "المدة (ثانية):", alertShare: "تم نسخ الرابط بنجاح! شاركه مع زملائك.", alertNoData: "الرجاء اختيار المادة أولاً.", alertImport: "تم استيراد المادة الجديدة بنجاح تلقائياً!" },
        en: { subtitle: "Memory Training & Self-Murojaah", lMaddah: "Subject Name:", lInput: "Data Input:", btnSave: "Save Materials", lSelect: "Choose Subject:", btnDelete: "Delete Subject", btnShare: "🔗 Share Subject", btnStart: "Start Random Practice", btnReveal: "Show Answer", lAns: "Correct Answer:", btnWrong: "Forgot", btnCorrect: "Memorized", resTitle: "Final Result", btnRestart: "Back to Menu", countMsg: (n) => `Found ${n} questions.`, tOn: "Enable Timer", tSec: "Duration (sec):", alertShare: "Link copied to clipboard! Share it with your friends.", alertNoData: "Please select a subject first.", alertImport: "New subject imported successfully!" }
    };

    let db = JSON.parse(localStorage.getItem('thoriqMultiMaddah')) || {};

    function toggleLangMenu() {
        document.getElementById("langDropdown").classList.toggle("show");
    }

    function changeLang(lang) {
        setLang(lang);
        document.getElementById("current-lang-btn").innerText = "🌐 " + lang.toUpperCase();
        document.getElementById("langDropdown").classList.remove("show");
    }

    window.addEventListener('click', function(event) {
        if (!event.target.matches('.dropbtn')) {
            const dropdowns = document.getElementsByClassName("dropdown-content");
            for (let i = 0; i < dropdowns.length; i++) {
                const openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    });

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('thoriqDarkMode', isDark);
        document.getElementById('dark-toggle').innerText = isDark ? '☀️' : '🌙';
    }

    function setLang(lang) {
        document.body.setAttribute('lang', lang);
        const t = i18n[lang];
        document.getElementById('txt-subtitle').innerText = t.subtitle;
        document.getElementById('txt-label-maddah').innerText = t.lMaddah;
        document.getElementById('txt-label-input').innerText = t.lInput;
        document.getElementById('txt-btn-save').innerText = t.btnSave;
        document.getElementById('txt-label-select').innerText = t.lSelect;
        document.getElementById('txt-btn-delete').innerText = t.btnDelete;
        document.getElementById('txt-btn-share').innerText = t.btnShare;
        document.getElementById('start-btn').innerText = t.btnStart;
        document.getElementById('reveal-btn').innerText = t.btnReveal;
        document.getElementById('txt-label-ans').innerText = t.lAns;
        document.getElementById('txt-btn-wrong').innerText = t.btnWrong;
        document.getElementById('txt-btn-correct').innerText = t.btnCorrect;
        document.getElementById('txt-res-title').innerText = t.resTitle;
        document.getElementById('txt-btn-restart').innerText = t.btnRestart;
        document.getElementById('txt-timer-on').innerText = t.tOn;
        document.getElementById('txt-timer-sec').innerText = t.tSec;
        updateMaddahInfo();
    }

    // FUNGSI BARU: Membuat Link Tautan Berisi Soal-soal (Enkripsi Base64 Aman)
    function shareSelectedMaddah() {
        const m = document.getElementById('select-maddah').value;
        const lang = document.body.getAttribute('lang') || 'ar';
        if (!m || !db[m]) {
            alert(i18n[lang].alertNoData);
            return;
        }

        const payload = { maddahName: m, questions: db[m] };
        // Mengubah objek soal menjadi string teks lalu dienkripsi ke Base64 agar aman di URL
        const encryptedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        
        // Membentuk URL utama + parameter data soal
        const shareUrl = window.location.origin + window.location.pathname + "?materi=" + encryptedData;

        // Menyalin tautan langsung ke clipboard HP/Laptop
        navigator.clipboard.writeText(shareUrl).then(() => {
            alert(i18n[lang].alertShare);
        });
    }

    // FUNGSI BARU: Mendeteksi & Mengimpor Tautan Otomatis Saat Web Dibuka
    function checkIncomingMateri() {
        const urlParams = new URLSearchParams(window.location.search);
        const materiData = urlParams.get('materi');
        const lang = document.body.getAttribute('lang') || 'ar';

        if (materiData) {
            try {
                // Membongkar sandi Base64 kembali menjadi struktur data soal
                const decryptedStr = decodeURIComponent(escape(atob(materiData)));
                const imported = JSON.parse(decryptedStr);

                if (imported.maddahName && imported.questions) {
                    // Menyimpan langsung ke database lokal browser penerima
                    db[imported.maddahName] = imported.questions;
                    localStorage.setItem('thoriqMultiMaddah', JSON.stringify(db));
                    
                    alert(i18n[lang].alertImport);

                    // Membersihkan URL browser agar parameter bersih kembali setelah diimpor
                    const cleanUrl = window.location.origin + window.location.pathname;
                    window.history.replaceState({}, document.title, cleanUrl);
                }
            } catch (e) {
                console.error("Gagal membaca enkripsi data link share.", e);
            }
        }
    }

    function processBulk() {
        const name = document.getElementById('maddah-name').value.trim();
        const input = document.getElementById('bulk-input').value.trim();
        if (!name || !input) return;
        if (!db[name]) db[name] = [];
        input.split('\n').forEach(line => {
            const sep = line.includes(' : ') ? ' : ' : (line.includes(':') ? ':' : (line.includes('؟') ? '؟' : '?'));
            if (line.includes(sep)) {
                const parts = line.split(sep);
                const q = parts[0].trim();
                const a = parts.slice(1).join(sep).trim();
                if (q && a) db[name].push({ q, a });
            }
        });
        localStorage.setItem('thoriqMultiMaddah', JSON.stringify(db));
        document.getElementById('bulk-input').value = "";
        initMaddahList();
    }

    function initMaddahList() {
        const select = document.getElementById('select-maddah');
        const currentVal = select.value;
        select.innerHTML = '<option value="">-- Select --</option>';
        Object.keys(db).forEach(m => {
            const opt = document.createElement('option');
            opt.value = m; opt.innerText = m;
            select.appendChild(opt);
        });
        select.value = currentVal;
        updateMaddahInfo();
    }

    function updateMaddahInfo() {
        const m = document.getElementById('select-maddah').value;
        const lang = document.body.getAttribute('lang') || 'ar';
        document.getElementById('count-info').innerText = (m && db[m]) ? i18n[lang].countMsg(db[m].length) : "...";
        document.getElementById('start-btn').disabled = !(m && db[m]);
    }

    function deleteSelectedMaddah() {
        const m = document.getElementById('select-maddah').value;
        if (m && confirm("Hapus madda " + m + "?")) {
            delete db[m];
            localStorage.setItem('thoriqMultiMaddah', JSON.stringify(db));
            initMaddahList();
        }
    }

    let currentQuestions = [], currentIdx = 0, score = 0, timerInterval;

    function startTimer() {
        const isTimerOn = document.getElementById('timer-toggle').checked;
        const duration = parseInt(document.getElementById('timer-duration').value) || 20;
        if (!isTimerOn) { document.getElementById('timer-container').style.display = 'none'; return; }

        let timeLeft = duration;
        document.getElementById('timer-container').style.display = 'block';
        const bar = document.getElementById('timer-bar');
        bar.style.transition = 'none'; bar.style.width = "100%"; bar.style.background = "var(--accent)";
        setTimeout(() => { bar.style.transition = 'width 1s linear'; }, 50);

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            const width = (timeLeft / duration) * 100;
            bar.style.width = width + "%";
            if (timeLeft <= 5) bar.style.background = "#e74c3c";
            if (timeLeft <= 0) { clearInterval(timerInterval); revealAnswer(); }
        }, 1000);
    }

    function startQuiz() {
        const m = document.getElementById('select-maddah').value;
        currentQuestions = [...db[m]].sort(() => Math.random() - 0.5);
        currentIdx = 0; score = 0;
        document.getElementById('setup-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const data = currentQuestions[currentIdx];
        document.getElementById('progress').innerText = `${currentIdx + 1} / ${currentQuestions.length}`;
        document.getElementById('q-text').innerText = data.q;
        document.getElementById('a-text').innerText = data.a;
        document.getElementById('answer-container').style.display = 'none';
        document.getElementById('eval-section').style.display = 'none';
        document.getElementById('reveal-btn').style.display = 'block';
        startTimer();
    }

    function revealAnswer() {
        clearInterval(timerInterval);
        document.getElementById('answer-container').style.display = 'block';
        document.getElementById('eval-section').style.display = 'grid';
        document.getElementById('reveal-btn').style.display = 'none';
    }

    function processResult(isCorrect) {
        if(isCorrect) score++;
        currentIdx++;
        if(currentIdx < currentQuestions.length) showQuestion();
        else {
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
            document.getElementById('score-text').innerText = `${score} / ${currentQuestions.length}`;
        }
    }

    window.onload = () => {
        if (localStorage.getItem('thoriqDarkMode') === 'true') {
            document.body.classList.add('dark-mode');
            document.getElementById('dark-toggle').innerText = '☀️';
        }
        checkIncomingMateri(); // Cek kiriman soal saat web dibuka
        initMaddahList();
    };
</script>
</body>
</html>
